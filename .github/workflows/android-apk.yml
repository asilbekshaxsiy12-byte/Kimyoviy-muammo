name: Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android
          npx cap sync android

      # Har safar bir xil imzo kaliti — yangi versiya eskisining ustiga o'rnatiladi
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-key-v1

      - name: Create signing key (first run only)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Kimyoviy Muammo,O=Asilbek Sunnatillayev,C=UZ"
          fi

      # Har bir yangi APK versiya raqami oshib boradi
      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KimyoviyMuammo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KimyoviyMuammo-apk
          path: KimyoviyMuammo.apk

      # Telefondan oson yuklab olish uchun Releases bo'limiga ham qo'yiladi
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Kimyoviy Muammo (so'nggi APK)
          body: |
            Telefoningizga o'rnatish uchun quyidagi **KimyoviyMuammo.apk** faylini yuklab oling.
            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: KimyoviyMuammo.apk
